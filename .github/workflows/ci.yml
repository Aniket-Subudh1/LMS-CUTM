name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # The build must need no environment (02 §5); the scan then checks the client bundle (09 §7).
      - run: npm run build
      - run: npm run check:bundle

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Without TEST_MONGODB_URI, tests/setup.ts starts a mongodb-memory-server replica set.
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
      # M02: lecture uploads go straight to object storage (presigned PUT), as in compose.yaml.
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: lmsdev
          RUSTFS_SECRET_KEY: lmsdev-secret-key
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: rs0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The e2e environment (10 §3) holds generated values only; nothing here is a real secret.
      - name: Write .env.e2e
        run: |
          cat > .env.e2e <<ENV
          PORT=3100
          APP_URL=http://localhost:3100
          MONGODB_URI=mongodb://localhost:27017/lms_e2e?replicaSet=rs0&directConnection=true
          REDIS_URL=redis://localhost:6379/2
          SESSION_PASSWORD=$(openssl rand -base64 32)
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_SECURE=false
          MAIL_FROM="CUTM LMS <lms@localhost>"
          LOG_LEVEL=info
          E2E_PASSWORD=$(openssl rand -hex 12)
          S3_ENDPOINT=http://localhost:9000
          S3_REGION=us-east-1
          S3_BUCKET=cutm-lms-e2e
          S3_ACCESS_KEY_ID=lmsdev
          S3_SECRET_ACCESS_KEY=lmsdev-secret-key
          S3_FORCE_PATH_STYLE=true
          ENV
      - run: npm run build
      - run: npm run db:indexes:e2e
      - run: npm run s3:setup:e2e
      - run: npm run db:seed:e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
