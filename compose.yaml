name: cutm-lms

services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:8.6
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: lmsdev
      RUSTFS_SECRET_KEY: lmsdev-secret-key
    ports: ['9000:9000', '9001:9001']
    volumes: ['s3-data:/data']

  mail:
    image: axllent/mailpit:v1.31
    ports: ['1025:1025', '8025:8025']

  # Live classes (M03): `docker compose --profile live up -d livekit`. Host networking, so the webhooks in livekit.yaml
  # reach the app on localhost and WebRTC needs no port mapping (Linux, or Docker Desktop with host networking on).
  livekit:
    image: livekit/livekit-server:v1.13
    profiles: ['live']
    command: ['--config', '/livekit.yaml']
    volumes: ['./livekit.yaml:/livekit.yaml:ro']
    network_mode: host

volumes:
  mongo-data:
  redis-data:
  s3-data:
